<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Админка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap">
<style>
*{box-sizing:border-box}
:root{--bg:#000;--fg:#f4f4f4;--mute:#8c8c8c;--line:#f4f4f4;--bad:#ff6b5b}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 "Arimo",Arial,sans-serif}
main{max-width:780px;margin:0 auto;padding:20px 16px 120px}
a{color:inherit}
.menu{display:inline-flex;border:2px solid var(--line);margin-bottom:40px}
.menu a,.menu b{padding:2px 10px;border-right:2px solid var(--line);text-decoration:none;font-weight:400}
.menu>:last-child{border-right:0}.menu a:hover{background:var(--fg);color:var(--bg)}
.win{position:relative;border:2px solid var(--line);background:var(--bg);margin:0 0 52px}
.tab{position:absolute;bottom:100%;left:-2px;margin:0;padding:2px 8px;border:2px solid var(--line);border-bottom:0;background:var(--bg);font:400 13px "Arimo",Arial,sans-serif;letter-spacing:.03em}
.tab.on{background:var(--fg);color:var(--bg)}
.pad{padding:14px 16px}
.sec{margin:0;padding:3px 16px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);font:400 12px "Arimo",Arial;letter-spacing:.06em;text-transform:uppercase}
.note{color:var(--mute);margin:0 0 12px;font-size:13px}
input,textarea,select{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--mute);border-radius:0;background:var(--bg);color:var(--fg)}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--fg)}
input::placeholder,textarea::placeholder{color:#5c5c5c}
label{display:block;margin-bottom:12px}
label span{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
button,.btn{font:inherit;cursor:pointer;border:2px solid var(--line);background:var(--bg);color:var(--fg);padding:5px 12px}
button:hover,.btn:hover{background:var(--fg);color:var(--bg)}
button.dark{background:var(--fg);color:var(--bg)}
button:disabled{opacity:.35;cursor:default;background:var(--bg);color:var(--fg)}
.ghost{border-width:1px;padding:2px 8px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pr{display:grid;grid-template-columns:3.5em 1fr auto;gap:10px;align-items:center;padding:7px 16px;border-bottom:1px dotted var(--mute)}
.pr .c{color:var(--mute)}
.pr div{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.item{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:12px 16px;border-bottom:1px dotted var(--mute)}
.item.f{grid-template-columns:1fr}
.item img{width:120px;height:90px;object-fit:cover;display:block;border:1px solid var(--line)}
.item input{margin-bottom:6px}
.tools{display:flex;gap:6px;margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--fg);color:var(--bg);padding:10px 16px;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.bar button{background:var(--bg);color:var(--fg);border-color:var(--bg)}
.msg{min-height:1.4em;margin:10px 0 0}
.err{color:var(--bad)}
.del{border-color:var(--bad);color:var(--bad)}.del:hover{background:var(--bad);color:var(--bg)}
[hidden]{display:none!important}
@media(max-width:560px){.two{grid-template-columns:1fr}.item{grid-template-columns:1fr}.item img{width:100%;height:auto}.pr{grid-template-columns:3em 1fr}.pr div{grid-column:1/-1;justify-content:flex-start}}
/* iOS-стиль */
body{background:#000;color:#e5e5ea}
.menu{border:1px solid rgba(255,255,255,.1);border-radius:6px;background:#141416;overflow:hidden}
.menu a,.menu b{border-right:1px solid rgba(255,255,255,.08);padding:6px 14px}
.menu a:hover{background:rgba(255,255,255,.1);color:#fff}
.win{border:1px solid rgba(255,255,255,.1);border-radius:7px;background:#141416;box-shadow:0 18px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.09);margin-bottom:24px;overflow:hidden}
.tab,.tab.on{position:relative;bottom:auto;left:auto;display:block;padding:9px 16px 9px 64px;background:rgba(255,255,255,.03);color:#f2f2f7;border:0;border-bottom:1px solid rgba(255,255,255,.08);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab::before{content:"";position:absolute;left:14px;top:50%;margin-top:-4px;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.28);box-shadow:13px 0 0 rgba(255,255,255,.16),26px 0 0 rgba(255,255,255,.1)}
.sec{border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#8e8e93}
input,textarea{border:1px solid rgba(255,255,255,.12);border-radius:5px;background:#202023}
select{width:100%;font:inherit;padding:7px 9px;border:1px solid rgba(255,255,255,.12);border-radius:5px;background:#202023;color:#f2f2f7}
input:focus,textarea:focus,select:focus{outline:none;border-color:rgba(255,255,255,.45)}
button,.btn{border:1px solid rgba(255,255,255,.16);border-radius:5px;background:#202023}
button:hover,.btn:hover{background:#2c2c2f;color:#fff}
button.dark{background:#f2f2f7;color:#000;border-color:#f2f2f7}
.pr,.item{border-bottom:1px solid rgba(255,255,255,.06)}
.item img{border-radius:5px;border-color:rgba(255,255,255,.12)}
.bar{background:#202023;color:#f2f2f7;border-top:1px solid rgba(255,255,255,.1)}
.bar button{background:#f2f2f7;color:#000;border-color:#f2f2f7}
.del{border-color:var(--bad);background:transparent}
</style>
</head>
<body>
<main>
<nav class="menu"><b>qwekurasa · админка</b><a href="/">← на сайт</a><a href="/#index">Проекты</a></nav>

<section class="win" id="login"><h2 class="tab on">Login</h2><div class="pad">
  <label><span>Пароль</span><input type="password" id="pw" autocomplete="current-password"></label>
  <button class="dark" id="enter">Войти</button>
  <p class="msg err" id="lmsg"></p></div>
</section>

<div id="app" hidden>
  <section class="win"><h2 class="tab">Projects Browser</h2>
    <div class="pad"><p class="note">Проекты идут на сайте в этом порядке и встают на места «Проект 01…10».</p>
    <button id="add">+ Новый проект</button></div>
    <div id="list" style="border-top:1px solid rgba(255,255,255,.08)"></div>
    <p class="sec">Категории</p>
    <div class="pad"><div class="row" id="cats" style="margin-bottom:10px"></div>
    <div class="row"><input id="c-new" maxlength="40" placeholder="Своя категория" style="flex:1;width:auto"><button id="c-add">+ Добавить категорию</button></div></div>
  </section>

  <section class="win" id="form" hidden><h2 class="tab on" id="ftitle">Project Editor</h2>
    <div class="pad">
    <label><span>Название *</span><input id="f-name" maxlength="60"></label>
    <div class="two">
      <label><span>Категория</span><select id="f-type"></select></label>
      <label><span>Дата создания</span><input id="f-created" placeholder="10.10.2026"></label>
      <label><span>Стек</span><input id="f-stack" placeholder="JavaScript, Swift"></label>
      <label><span>Платформы</span><input id="f-platforms" placeholder="iPhone, браузер"></label>
    </div>
    <div class="row" id="newcat" hidden style="margin:-4px 0 12px"><input id="f-cat" maxlength="40" placeholder="Название новой категории" style="flex:1;width:auto"><button id="addCat">Добавить</button></div>
    <label><span>Ссылка (с https://)</span><input id="f-link" placeholder="https://…"></label>
    <div class="two">
      <label><span>Устройство слева на странице проекта</span><select id="f-device"><option value="phone">iPhone — приложение</option><option value="ipad">iPad — сайт</option></select></label>
      <label><span id="pwaLbl">Адрес web-приложения (с https://)</span><input id="f-pwa" placeholder="https://…"></label>
    </div>
    <label style="margin:0"><span>Описание — курсивом в System Browser</span><textarea id="f-desc"></textarea></label>
    </div>
    <p class="sec">Экраны — окна Form Editor</p>
    <div id="shots"></div>
    <div class="pad"><label class="btn" style="display:inline-block;margin:0">+ Добавить фото<input type="file" id="files" accept="image/*" multiple hidden></label></div>
    <p class="sec">Функции — окно File List</p>
    <div id="feats"></div>
    <div class="pad"><button id="addF">+ Добавить функцию</button></div>
    <div class="pad row" style="border-top:1px solid rgba(255,255,255,.08)"><button class="dark" id="done">Готово</button><button id="cancel">Отмена</button><button id="del" class="del" style="margin-left:auto">Удалить проект</button></div>
  </section>
</div>
</main>

<div class="bar" id="bar" hidden><span id="bmsg">Публикация…</span><button class="dark" id="publish" hidden>Повторить</button></div>

<script>
const $=s=>document.querySelector(s);
let PW=sessionStorage.getItem('pw')||'',cats=[],list=[],removed=[],pending=[],edit=null,dirty=false;
const esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]);

async function api(body){const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pw:PW,...body})});
  const j=await r.json().catch(()=>({error:'Ошибка сервера '+r.status}));if(!r.ok)throw new Error(j.error||r.status);return j}

function loadData(){return new Promise(res=>{const s=document.createElement('script');s.src='/projects.js?v='+Date.now();s.onload=s.onerror=()=>{list=JSON.parse(JSON.stringify(window.CUSTOM||[]));cats=[...(window.CATS||[])];res()};document.head.append(s)})}

async function login(){$('#lmsg').textContent='';try{await api({op:'check'});sessionStorage.setItem('pw',PW);$('#login').hidden=true;$('#app').hidden=false;await loadData();render();renderCats()}
  catch(e){$('#lmsg').textContent=e.message;sessionStorage.removeItem('pw')}}
$('#enter').onclick=()=>{PW=$('#pw').value;login()};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#enter').click()};
if(PW)login();

function mark(){dirty=true;$('#bar').hidden=false;publish()}
function render(){
  $('#list').innerHTML=list.map((p,i)=>`<div class="pr"><span class="c">P${String(i+1).padStart(3,'0')}</span><span>${esc(p.name)}</span><div>
    <button class="ghost" data-a="up" data-i="${i}" ${i?'':'disabled'}>↑</button><button class="ghost" data-a="down" data-i="${i}" ${i<list.length-1?'':'disabled'}>↓</button><button class="ghost" data-a="edit" data-i="${i}">Изменить</button>${p.id?`<a class="btn ghost" href="/#p-c${esc(p.id)}" target="_blank" rel="noopener">Открыть ↗</a>`:''}</div></div>`).join('')||'<p class="pr note" style="display:block">Пока нет проектов.</p>'}
$('#list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i;
  if(b.dataset.a==='edit')open(i);
  else{const j=b.dataset.a==='up'?i-1:i+1;[list[i],list[j]]=[list[j],list[i]];mark();render()}};

const BASE=['Сайт','Приложение','Бот','Дизайн','Инструмент'];
const used=()=>list.map(p=>p.type).filter(Boolean);
const allCats=()=>[...new Set([...BASE,...cats,...used()])];
function fillTypes(v){$('#f-type').innerHTML='<option value="">— без категории —</option>'+allCats().map(c=>`<option>${esc(c)}</option>`).join('')+'<option value="+">+ Своя категория…</option>';$('#f-type').value=v||'';$('#newcat').hidden=true}
function addCat(v){const c=v.trim().slice(0,40);if(!c)return;if(!allCats().includes(c)){cats.push(c);mark()}renderCats();return c}
function renderCats(){const u=used();$('#cats').innerHTML=allCats().map(c=>`<span class="btn ghost" style="cursor:default">${esc(c)}${cats.includes(c)&&!u.includes(c)?` <a href="#" data-c="${esc(c)}" title="Удалить" style="text-decoration:none">×</a>`:''}</span>`).join('')}
$('#cats').onclick=e=>{const a=e.target.closest('[data-c]');if(!a)return;e.preventDefault();cats=cats.filter(c=>c!==a.dataset.c);renderCats();mark()};
$('#c-add').onclick=()=>{if(addCat($('#c-new').value))$('#c-new').value=''};
$('#c-new').onkeydown=e=>{if(e.key==='Enter')$('#c-add').click()};
$('#f-type').onchange=()=>{const n=$('#f-type').value==='+';$('#newcat').hidden=!n;if(n){$('#f-cat').value='';$('#f-cat').focus()}};
$('#addCat').onclick=()=>{const c=addCat($('#f-cat').value);if(c)fillTypes(c)};
$('#f-cat').onkeydown=e=>{if(e.key==='Enter')$('#addCat').click()};
const F=['name','type','created','stack','platforms','link','pwa','device','desc'];
$('#f-device').onchange=()=>{$('#pwaLbl').textContent=$('#f-device').value==='ipad'?'Адрес сайта — откроется в iPad (с https://)':'Адрес web-приложения — запустится в iPhone (с https://)'};
function open(i){edit={i,shots:(i==null?[]:list[i].shots||[]).map(s=>({...s})),feats:(i==null?[]:list[i].features||[]).map(f=>({h:f.h||'',p:f.p||'',ul:(f.ul||[]).join('\n')}))};
  const p=i==null?{}:list[i];fillTypes(p.type);F.forEach(k=>k!=='type'&&($('#f-'+k).value=p[k]||(k==='device'?'phone':'')));$('#f-device').onchange();
  $('#ftitle').textContent=i==null?'Project Editor · новый':'Project Editor · '+p.name;$('#del').hidden=i==null;
  $('#form').hidden=false;drawShots();drawFeats();$('#form').scrollIntoView({behavior:'smooth'})}
$('#add').onclick=()=>open(null);
$('#cancel').onclick=()=>{edit=null;$('#form').hidden=true};

function drawShots(){$('#shots').innerHTML=edit.shots.map((s,k)=>`<div class="item"><img src="${s.preview||'/'+esc(s.src)}" alt="">
  <div><input data-k="${k}" data-f="h" placeholder="Заголовок фото" value="${esc(s.h)}" style="margin-bottom:6px">
  <textarea data-k="${k}" data-f="p" placeholder="Описание фото" style="min-height:60px">${esc(s.p)}</textarea>
  <div class="tools"><button class="ghost" data-k="${k}" data-a="up" ${k?'':'disabled'}>↑</button><button class="ghost" data-k="${k}" data-a="down" ${k<edit.shots.length-1?'':'disabled'}>↓</button><button class="ghost" data-k="${k}" data-a="rm">Убрать</button></div></div></div>`).join('')}
$('#shots').oninput=e=>{const t=e.target;if(t.dataset.f)edit.shots[t.dataset.k][t.dataset.f]=t.value};
$('#shots').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=+b.dataset.k,S=edit.shots;
  if(b.dataset.a==='rm')S.splice(k,1);else{const j=b.dataset.a==='up'?k-1:k+1;[S[k],S[j]]=[S[j],S[k]]}drawShots()};
function drawFeats(){$('#feats').innerHTML=edit.feats.map((f,k)=>`<div class="item f"><div><input data-k="${k}" data-f="h" placeholder="Название, например «Импорт выписки»" value="${esc(f.h)}">
  <textarea data-k="${k}" data-f="p" placeholder="Короткое описание" style="min-height:52px;margin-bottom:6px">${esc(f.p)}</textarea>
  <textarea data-k="${k}" data-f="ul" placeholder="Пункты списка — каждый с новой строки (необязательно)" style="min-height:52px">${esc(f.ul)}</textarea>
  <div class="tools"><button class="ghost" data-k="${k}" data-a="up" ${k?'':'disabled'}>↑</button><button class="ghost" data-k="${k}" data-a="down" ${k<edit.feats.length-1?'':'disabled'}>↓</button><button class="ghost" data-k="${k}" data-a="rm">Убрать</button></div></div></div>`).join('')}
$('#feats').oninput=e=>{const t=e.target;if(t.dataset.f)edit.feats[t.dataset.k][t.dataset.f]=t.value};
$('#feats').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=+b.dataset.k,S=edit.feats;
  if(b.dataset.a==='rm')S.splice(k,1);else{const j=b.dataset.a==='up'?k-1:k+1;[S[k],S[j]]=[S[j],S[k]]}drawFeats()};
$('#addF').onclick=()=>{edit.feats.push({h:'',p:'',ul:''});drawFeats()};
$('#files').onchange=async e=>{for(const f of e.target.files){const blob=await shrink(f);edit.shots.push({blob,preview:URL.createObjectURL(blob),h:'',p:''})}e.target.value='';drawShots()};

// фото загружается как есть; пережимается без уменьшения только если больше лимита запроса Vercel (~3 МБ)
async function shrink(f){if(f.size<=3e6&&/^image\/(jpeg|png|webp)$/.test(f.type))return f;
  const bm=await createImageBitmap(f),c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);
  for(const q of[.95,.9,.85,.75]){const b=await new Promise(res=>c.toBlob(res,'image/webp',q));if(b.size<=3e6)return b}
  return new Promise(res=>c.toBlob(res,'image/webp',.7))}

$('#done').onclick=()=>{const name=$('#f-name').value.trim();if(!name){$('#f-name').focus();return}
  const old=edit.i==null?null:list[edit.i],p={id:old?.id||Date.now().toString(36)};F.forEach(k=>p[k]=$('#f-'+k).value.trim());if(p.type==='+')p.type='';
  (old?.shots||[]).forEach(s=>{if(!edit.shots.some(n=>n.src===s.src))removed.push(s.src)});
  p.shots=edit.shots;p.features=edit.feats.filter(f=>f.h.trim()).map(f=>({h:f.h.trim(),p:f.p.trim(),ul:f.ul.split('\n').map(x=>x.trim()).filter(Boolean)}));if(old)list[edit.i]=p;else list.push(p);
  edit=null;$('#form').hidden=true;mark();render();renderCats()};
$('#del').onclick=()=>{const p=list[edit.i];if(!confirm('Удалить «'+p.name+'»?'))return;
  (p.shots||[]).forEach(s=>s.src&&removed.push(s.src));list.splice(edit.i,1);edit=null;$('#form').hidden=true;mark();render();renderCats()};

const b64=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(b)});
let busy=false,again=false;
async function publish(){if(busy){again=true;return}busy=true;$('#publish').hidden=true;const files=pending;
  try{let n=0,total=list.reduce((a,p)=>a+(p.shots||[]).filter(s=>s.blob).length,0);
    for(const p of list)for(const s of p.shots||[])if(s.blob){$('#bmsg').textContent=`Загрузка фото ${++n}/${total}…`;
      const {sha}=await api({op:'blob',data:await b64(s.blob)}),path=`img/${p.id}/${Math.random().toString(36).slice(2,10)}.${{'image/jpeg':'jpg','image/png':'png'}[s.blob.type]||'webp'}`;
      files.push({path,sha});s.src=path;delete s.blob;delete s.preview}
    $('#bmsg').textContent='Публикация…';
    const clean=list.map(p=>({...p,features:p.features||[],shots:(p.shots||[]).map(s=>({src:s.src,h:s.h||'',p:s.p||''}))}));
    await api({op:'commit',json:JSON.stringify(clean),cats,files,del:removed.filter(x=>!files.some(f=>f.path===x)),msg:'Админка: обновление проектов'});
    removed=[];pending=[];dirty=false;$('#bmsg').textContent='Опубликовано. Сайт обновится примерно через минуту.';setTimeout(()=>{if(!dirty)$('#bar').hidden=true},6000);render()}
  catch(e){$('#bmsg').textContent='Ошибка: '+e.message;$('#publish').hidden=false}
  busy=false;if(again){again=false;publish()}}
$('#publish').onclick=publish;
addEventListener('beforeunload',e=>{if(dirty)e.preventDefault()});
</script>
</body>
</html>
